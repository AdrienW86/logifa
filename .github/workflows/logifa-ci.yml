name: LOGIFA validation
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and isolated PostgreSQL scenarios
        run: npm test
      - name: Production build (without production credentials)
        run: npm run build
      - name: Chromium for isolated interface recipe
        run: npx playwright install --with-deps chromium
      - name: Browser interface recipe (synthetic data)
        run: npm run test:browser
